cases: ["CASE_0.3", "CASE_0.5", "CASE_1", "CASE_1.5"]
proportions: [0.1, 0.3, 0.5, 0.8, 1.0]
sexes: ["f", "m"]

# Number of datasets per (case, proportion) – used as range(0, n_datasets)
n_datasets: 10

# Simulation knobs
n_people_to_simulate: 60
n_samples_per_group_and_sex: 40

# Aggregation settings
mean_types: ["mean", "tri_mean", "trim_mean"]
trim_mean_fractions:
  default: [0]
  trim_mean: [0.05, 0.1]
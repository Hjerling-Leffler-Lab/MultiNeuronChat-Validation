cases: ["CASE_0.3", "CASE_0.5", "CASE_1", "CASE_1.5"]
proportions: [0.1, 0.3, 0.5, 0.8, 1.0]
sexes: ["f", "m"]

# Number of datasets per (case, proportion) – used as range(0, n_datasets)
n_datasets: 10

# Simulation knobs
n_people_to_simulate: 60
n_samples_per_group_and_sex: 40

# Aggregation settings
mean_types: ["mean", "tri_mean", "trim_mean"]
trim_mean_fractions:
  default: [0]
  trim_mean: [0.05, 0.1]

# Population-size (donor-count) benchmark.
# n_donors_sweep values are donors PER SEX PER GROUP, sub-sampled without replacement from the
# existing simulated patient pool (no SPARSim re-run). proportion is pinned to 1.0 so the sweep
# isolates the effect of cohort size.
n_donors_sweep: [2, 3, 5, 8, 10, 20]
n_sweep_cases: ["CASE_0.5", "CASE_1"]
n_sweep_proportion: 1.0
n_sweep_mean_types: ["mean", "tri_mean"]